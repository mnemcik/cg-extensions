# tmux settings for AI sessions started by the cg tmux extension.
# Applied only when cg-tmux starts the tmux server (tmux -f); an already
# running server keeps its own settings, and ~/.tmux.conf is not read for it.
set -g mouse on              # scroll and switch panes with the mouse / trackpad
set -g history-limit 100000  # long sessions and logs
set -sg escape-time 10       # Esc reaches the agent at once (tmux default: 500 ms delay)
set -g extended-keys on      # Shift+Enter and other modified keys reach the agent
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -g status-right "#S "
# The terminal's tab/window title follows the agent's own title (Claude Code sets
# it from the conversation and from /rename); otherwise it shows the outer command.
set -g set-titles on
set -g set-titles-string "#T"
# Let the agent's desktop notifications (OSC 9 / 777, e.g. "finished") reach the
# outer terminal. -q: tmux before 3.3 has no such option and skips the line.
set -gq allow-passthrough on
